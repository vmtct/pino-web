name = "pino-web-piner-f0-preview"
compatibility_date = "2026-08-10"
main = "worker-piner.ts"
workers_dev = true
keep_vars = true

[vars]
ENVIRONMENT = "preview"

[[services]]
binding = "PINO_MEMBER_CORE"
service = "pino-core-staging"
entrypoint = "ParentMemberControlPlane"

[[services]]
binding = "TOPPI_MEMBER"
service = "toppi-web-staging"

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
