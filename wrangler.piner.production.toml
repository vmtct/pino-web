name = "piner"
compatibility_date = "2026-08-10"
main = "worker-piner.ts"
workers_dev = false
keep_vars = true

[vars]
ENVIRONMENT = "production"

[[services]]
binding = "PINO_MEMBER_CORE"
service = "pino-core"
entrypoint = "ParentMemberControlPlane"

[[services]]
binding = "PINO_PINER_HANDOFF"
service = "pino-core"
entrypoint = "PinerHandoffControlPlane"

[[routes]]
pattern = "piner.pinohouse.art"
custom_domain = true

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
