name = "pino-web-staging"
compatibility_date = "2026-08-10"
main = "worker-entry.ts"
workers_dev = true
keep_vars = false

[vars]
ENVIRONMENT = "staging"
PINO_CORE_REGISTRATION_ENABLED = "false"

[[services]]
binding = "PINO_CORE_PUBLIC"
service = "pino-core-staging"
entrypoint = "PublicOpenStudioControlPlane"

[[services]]
binding = "PINO_MEMBER_CORE"
service = "pino-core-staging"
entrypoint = "ParentMemberControlPlane"

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*", "/build-info.json"]
