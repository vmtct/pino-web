name: Piner Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "app/piner/**"
      - "lib/piner-space-contract.ts"
      - "lib/piner-space-source.ts"
      - "test/piner-space.test.ts"
      - "tsconfig.piner.json"
      - ".github/workflows/piner-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Piner typecheck
        run: bunx tsc -p tsconfig.piner.json
      - name: Piner contract tests
        run: node --test --experimental-strip-types test/piner-space.test.ts
      - name: Production build
        run: bun run build
