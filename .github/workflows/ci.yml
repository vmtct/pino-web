name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check production app
        run: |
          set -e
          base="https://pino-web.minhtri-van42.workers.dev"
          status=$(curl -sS -o /tmp/home.html -w "%{http_code}" "$base/")
          test "$status" = "200"
          status=$(curl -sS -o /tmp/sessions.json -w "%{http_code}" "$base/api/os-sessions")
          test "$status" = "200"
          grep -q 'sessions' /tmp/sessions.json

          status=$(curl -sS -o /tmp/book.json -w "%{http_code}" -X POST "$base/api/open-studio/book" -H 'Content-Type: application/json' -d '{}')
          test "$status" = "400"
          grep -q 'required' /tmp/book.json

          echo "Production smoke tests passed"
