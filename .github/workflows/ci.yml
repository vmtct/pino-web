name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pino-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build

  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event_name == 'pull_request' && 'https://fix-open-studio-past-detail-pino-web.minhtri-van42.workers.dev' || 'https://pino-web.minhtri-van42.workers.dev' }}
    steps:
      - name: Wait for deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/home.html -w "%{http_code}" "$BASE_URL/") || status=000
            if [ "$status" = "200" ]; then
              echo "Deployment reachable"
              exit 0
            fi
            echo "Deployment not ready yet (attempt $attempt/30, HTTP $status)"
            sleep 10
          done
          exit 1
      - name: Run smoke tests
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/sessions.json -w "%{http_code}" "$BASE_URL/api/os-sessions")
          test "$status" = "200"
          grep -q 'sessions' /tmp/sessions.json

          status=$(curl -sS -o /tmp/book.json -w "%{http_code}" -X POST "$BASE_URL/api/open-studio/book" -H 'Content-Type: application/json' -d '{}')
          test "$status" = "400"
          grep -q 'required' /tmp/book.json

          echo "Smoke tests passed"

  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://fix-open-studio-past-detail-pino-web.minhtri-van42.workers.dev' || 'https://pino-web.minhtri-van42.workers.dev' }}
      E2E_MEMBER_PHONE: ${{ secrets.E2E_MEMBER_PHONE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright E2E
        env:
          CI: true
        run: bunx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
