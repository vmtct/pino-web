name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pino-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Project-Code metadata
        if: github.event_name == 'pull_request'
        env:
          PINO_PR_BODY: ${{ github.event.pull_request.body }}
          PINO_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/verify-pr-project-code.mjs
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Production release boundary contract tests
        run: node --test --experimental-strip-types test/production-release-governance.test.ts test/h7-remediation.test.ts
      - name: Build
        run: bun run build

  failure-intake:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'failure'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Create structured CI failure intake
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const run = context.runId;
            const sha = context.sha;
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run, per_page: 100
            });
            const failed = jobs
              .filter(j => ['failure', 'timed_out', 'cancelled'].includes(j.conclusion))
              .map(j => ({
                name: j.name,
                conclusion: j.conclusion,
                url: j.html_url,
                failedSteps: (j.steps || [])
                  .filter(s => ['failure', 'timed_out', 'cancelled'].includes(s.conclusion))
                  .map(s => s.name)
              }));
            const title = `CI Failure Intake — ${sha.slice(0, 7)} — run ${run}`;
            const body = [
              '# CI Failure Intake',
              '',
              `- **Commit:** \\`${sha}\\``,
              `- **Run:** ${run}`,
              `- **Run URL:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${run}`,
              `- **Build:** ${process.env.BUILD_RESULT}`,
              '',
              '## Failed jobs',
              '```json',
              JSON.stringify(failed, null, 2),
              '```',
              '',
              '## Agent instruction',
              'Treat this issue as machine-generated CI evidence. Inspect the referenced workflow run, failed job logs, and commit diff before proposing or applying a fix.',
              '',
              '## Safety boundary',
              'Do not mutate production data merely to reproduce the failure. Prefer tests, mocks, validation-only endpoints, or disposable E2E fixtures.',
            ].join('\\n');
            await github.rest.issues.create({ owner, repo, title, body });
