name: Autonomous Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: autonomous-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  MAX_PR_WAIT_MINUTES: '30'
  PR_POLL_SECONDS: '30'

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create recovery branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          BRANCH="agent/recovery-${RUN_ID}"
          git switch -c "$BRANCH" "$SHA"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Capture failed CI context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --json name,displayTitle,conclusion,headSha,jobs,url > .agent-run.json
          gh run view "$RUN_ID" --log-failed > .agent-failure.log 2>&1 || true
          if [ ! -s .agent-failure.log ]; then
            echo "No failed-step log was returned; inspect the workflow run and jobs directly with gh." > .agent-failure.log
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('.agent-failure.log')
          text = p.read_text(encoding='utf-8', errors='replace')
          max_chars = 28000
          if len(text) > max_chars:
              text = text[:5000] + "\n\n[... CI LOG TRUNCATED ...]\n\n" + text[-23000:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent runtime
        run: python -m pip install --disable-pip-version-check openai-agents

      - name: Run autonomous recovery agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AGENT_MODEL: gpt-5.6-sol
          OPENAI_AGENT_MAX_TURNS: '40'
          MAX_FIX_ATTEMPTS: '3'
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AGENT_BRANCH: ${{ steps.branch.outputs.branch }}
        run: python agent/dev_agent.py

      - name: Find recovery PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          for i in {1..10}; do
            PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -n "$PR_NUMBER" ]; then
              echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Recovery agent did not open a PR." >&2
          exit 1

      - name: Wait for recovery PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MAX_PR_WAIT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            STATE="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
            if [ "$STATE" != "OPEN" ]; then
              echo "PR is no longer open: $STATE"
              exit 0
            fi

            CHECKS="$(gh pr checks "$PR_NUMBER" 2>&1 || true)"
            echo "$CHECKS"

            if echo "$CHECKS" | grep -Eq '(^|[[:space:]])(fail|cancelled|timed_out|failure)([[:space:]]|$)'; then
              echo "Recovery PR checks failed. Agent must diagnose the failed PR CI." >&2
              exit 1
            fi

            if echo "$CHECKS" | grep -q 'no checks reported'; then
              sleep "$PR_POLL_SECONDS"
              continue
            fi

            if ! echo "$CHECKS" | grep -Eq '(^|[[:space:]])(pending|queued|in_progress)([[:space:]]|$)'; then
              echo "All reported recovery PR checks passed."
              exit 0
            fi

            sleep "$PR_POLL_SECONDS"
          done

          echo "Timed out waiting for recovery PR checks." >&2
          exit 1

      - name: Auto-merge verified recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --delete-branch --subject "chore: merge autonomous recovery" --body "Autonomous recovery PR verified by PR CI. Production validation remains authoritative on main."

      - name: Upload agent diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-recovery-${{ github.event.workflow_run.id }}
          path: |
            .agent-run.json
            .agent-failure.log
          if-no-files-found: ignore
