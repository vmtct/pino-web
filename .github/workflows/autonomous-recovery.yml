name: Autonomous Recovery

# PINO Agency is intentionally paused. Keep this workflow file for easy reactivation.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: autonomous-recovery-main
  cancel-in-progress: true

jobs:
  recover:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PINO Agency is paused. No autonomous recovery will run."
