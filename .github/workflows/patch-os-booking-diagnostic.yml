name: Patch OS booking diagnostic
on:
  push:
    paths:
      - .github/trigger-os-booking-debug
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deployed member worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker-member-v2.ts')
          s = p.read_text()
          old = 'const text=(p:any)=>p?.title?.[0]?.plain_text||p?.rich_text?.[0]?.plain_text||p?.select?.name||"";'
          new = 'const text=(p:any)=>p?.title?.[0]?.plain_text||p?.rich_text?.[0]?.plain_text||p?.select?.name||p?.status?.name||"";'
          if old in s: s = s.replace(old, new, 1)
          old = 'const select=(p:any)=>p?.select?.name||null;'
          new = 'const select=(p:any)=>p?.select?.name||p?.status?.name||null;'
          if old in s: s = s.replace(old, new, 1)
          marker = 'const relationIds=(p:any):string[]=>p?.relation?.map((r:any)=>r.id).filter(Boolean)||[];'
          helper = 'const canonicalSessionType=(value:string|null)=>{const normalized=(value||"").normalize("NFKC").replace(/\\s+/g," ").trim().toLowerCase();if(normalized==="open studio")return "Open Studio";if(normalized==="premium")return "Premium";return (value||"").normalize("NFKC").replace(/\\s+/g," ").trim();};'
          if 'const canonicalSessionType=' not in s:
              if marker not in s: raise SystemExit('relationIds marker not found')
              s = s.replace(marker, marker + '\n' + helper, 1)
          old = 'type:text(page.properties?.["Type"]),path:paths[0]||null'
          new = 'type:canonicalSessionType(text(page.properties?.["Type"])),path:paths[0]||null'
          if old in s: s = s.replace(old, new, 1)
          old = 'if(session.type!=="Open Studio"&&session.type!=="Premium")return {ok:false as const,status:409,error:"This session is not bookable with an Open Studio pass."};'
          new = 'const sessionType=canonicalSessionType(session.type);if(sessionType!=="Open Studio"&&sessionType!=="Premium")return {ok:false as const,status:409,error:`This session is not bookable with an Open Studio pass (${sessionType||"unknown type"}).`};'
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/trigger-os-booking-debug
          git add worker-member-v2.ts .github/trigger-os-booking-debug
          git commit -m 'fix: use deployed member worker for OS booking type'
          git push
