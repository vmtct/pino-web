name: Patch OS booking diagnostic
on:
  push:
    paths:
      - .github/trigger-os-booking-debug
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker entitlement normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.ts')
          s = p.read_text()

          old_text = 'const propText=(p:any)=>p?.title?.[0]?.plain_text||p?.rich_text?.[0]?.plain_text||p?.select?.name||"";'
          new_text = 'const propText=(p:any)=>p?.title?.[0]?.plain_text||p?.rich_text?.[0]?.plain_text||p?.select?.name||p?.status?.name||"";'
          if old_text in s:
              s = s.replace(old_text, new_text, 1)

          old_prop = 'const propSelect=(p:any)=>p?.select?.name||null;'
          new_prop = 'const propSelect=(p:any)=>p?.select?.name||p?.status?.name||null;\nconst canonicalSessionType=(value:string|null)=>{const normalized=(value||"").normalize("NFKC").replace(/\\s+/g," ").trim().toLowerCase();if(normalized==="open studio")return "Open Studio";if(normalized==="premium")return "Premium";return (value||"").normalize("NFKC").replace(/\\s+/g," ").trim();};'
          if old_prop in s:
              s = s.replace(old_prop, new_prop, 1)
          elif 'const canonicalSessionType=' not in s:
              raise SystemExit('target propSelect not found')

          old_type = 'type:propText(page.properties?.["Type"])'
          new_type = 'type:canonicalSessionType(propText(page.properties?.["Type"]))'
          if old_type in s:
              s = s.replace(old_type, new_type, 1)

          old_check = 'if(rule.accessScope!=="Any"&&session.type!=="Open Studio"&&session.type!=="Premium")return {ok:false as const,status:409,error:"This pass cannot access this session."};'
          new_check = 'const sessionType=canonicalSessionType(session.type);if(rule.accessScope!=="Any"&&sessionType!=="Open Studio"&&sessionType!=="Premium")return {ok:false as const,status:409,error:`This pass cannot access this session (${sessionType||"unknown type"}).`};'
          if old_check in s:
              s = s.replace(old_check, new_check, 1)
          elif 'const sessionType=canonicalSessionType(session.type);' not in s:
              raise SystemExit('target booking access check not found')

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/trigger-os-booking-debug
          git add worker.ts .github/trigger-os-booking-debug
          git commit -m 'fix: read Notion status properties as text'
          git push
