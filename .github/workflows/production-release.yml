name: Web Production Release
run-name: ${{ github.event.issue.user.login == 'vmtct' && format('Web production release #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED Web production release #{0} @ {1}', github.event.issue.number, github.sha) }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
  checks: read

concurrency:
  group: web-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.issue.title == '[GPT] Web production release' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      WEB_WORKER: pino-web
      CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
      ZONE_ID: 48b2809afabf3d65d30f80f346126213

    steps:
      - name: Validate Founder release request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          echo "AUTH_BODY_HASH=$AUTH_BODY_HASH" >> "$GITHUB_ENV"
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "Production release authority is one-shot; re-authorize with a fresh issue." >&2; exit 1; }
          repo="$GITHUB_REPOSITORY"
          fail_request() {
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "WEB_PRODUCTION_RELEASE: **REJECTED**\n\n$1\n\nNo production mutation was attempted."
            exit 1
          }

          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^WEB_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || fail_request "Issue body must contain exactly one WEB_SHA line with a 40-hex SHA."
          web_sha="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          grep -Eq '^CONFIRM:[[:space:]]*RELEASE_PRODUCTION[[:space:]]*$' <<<"$ISSUE_BODY" \
            || fail_request "Issue body must contain CONFIRM: RELEASE_PRODUCTION."

          main_sha="$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" \
            || fail_request "Cannot resolve current main HEAD."
          [ "$web_sha" = "$main_sha" ] || fail_request "Requested SHA is not current main HEAD."

          prs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${repo}/commits/${web_sha}/pulls")" \
            || fail_request "Cannot resolve pull-request provenance."
          jq -e --arg sha "$web_sha" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length >= 1' <<<"$prs" >/dev/null \
            || fail_request "Current main HEAD is not proven to be a merged pull request into main."

          ci="$(gh api "/repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${web_sha}&branch=main&status=completed&per_page=20")" \
            || fail_request "Cannot read CI result for requested SHA."
          jq -e --arg sha "$web_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length >= 1' <<<"$ci" >/dev/null \
            || fail_request "No successful completed CI run exists for this main SHA."

          checks="$(gh api "/repos/${repo}/commits/${web_sha}/check-runs?per_page=100")" \
            || fail_request "Cannot inspect candidate build checks."
          jq -e '[.check_runs[] | select(.name == "Workers Builds: pino-web" and .status == "completed" and .conclusion == "success")] | length >= 1' <<<"$checks" >/dev/null \
            || fail_request "No successful Cloudflare immutable-candidate build exists for this SHA."

          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"
          echo "WEB_SHA=$web_sha" >> "$GITHUB_ENV"

      - name: Check out exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.web_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Re-run locked validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEB_SHA"
          test -z "$(git status --porcelain)"
          bun install --frozen-lockfile
          bun run typecheck
          node --test --experimental-strip-types test/production-release-governance.test.ts
          bun run build

      - name: Promote exact tagged candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          old_deployment_id=""
          old_version=""
          candidate_deployment_id=""
          deployment_marker=""
          promotion_attempted=0
          already_active=0
          comment() { gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "$1"; }
          rollback() {
            [ "$promotion_attempted" -eq 1 ] || return 0
            [ -n "$old_deployment_id" ] && [ -n "$old_version" ] && [ -n "${candidate_id:-}" ] && [ -n "$deployment_marker" ] || return 1
            local state current_deployment current_version current_marker previous_deployment decision after after_version
            state="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}" 2>/dev/null)" || return 1
            current_deployment="$(jq -r '.result.deployments[0].id // empty' <<<"$state")"
            current_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$state" | head -1)"
            current_marker="$(jq -r '.result.deployments[0].annotations["workers/message"] // empty' <<<"$state")"
            previous_deployment="$(jq -r '.result.deployments[1].id // empty' <<<"$state")"
            decision="$(node scripts/web-production-release-fence.mjs "$(jq -nc --arg oldDeploymentId "$old_deployment_id" --arg oldVersion "$old_version" --arg candidateDeploymentId "$candidate_deployment_id" --arg candidateVersion "$candidate_id" --arg candidateMarker "$deployment_marker" --arg currentDeploymentId "$current_deployment" --arg currentVersion "$current_version" --arg currentMarker "$current_marker" --arg previousDeploymentId "$previous_deployment" '{oldDeploymentId:$oldDeploymentId,oldVersion:$oldVersion,candidateDeploymentId:$candidateDeploymentId,candidateVersion:$candidateVersion,candidateMarker:$candidateMarker,currentDeploymentId:$currentDeploymentId,currentVersion:$currentVersion,currentMarker:$currentMarker,previousDeploymentId:$previousDeploymentId}')")" || return 1
            case "$decision" in
              RESTORE) npx wrangler versions deploy "${old_version}@100%" --name "$WEB_WORKER" -y >/dev/null 2>&1 || return 1 ;;
              NOOP) ;;
              *) return 1 ;;
            esac
            after="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}" 2>/dev/null)" || return 1
            after_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$after" | head -1)"
            [ "$after_version" = "$old_version" ]
          }
          fail() {
            local message="$1" rollback_note="No candidate traffic promotion had started."
            if [ "$promotion_attempted" -eq 1 ]; then
              if rollback; then rollback_note="Prior Web version was restored or exact pinned baseline remained active."; else rollback_note="Rollback was refused or failed because exact failed-promotion ownership could not be proven; no external deployment was overwritten."; fi
            fi
            comment "WEB_PRODUCTION_RELEASE: **FAIL_SAFE**\n\nWorkflow run: ${GITHUB_RUN_ID}\nWorkflow attempt: ${GITHUB_RUN_ATTEMPT}\n\n${message}\n\n${rollback_note}\n\nNo route, binding, secret, D1, or application-data mutation was authorized."
            exit 1
          }

          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] \
            || fail "CLOUDFLARE_API_TOKEN is unavailable. No Cloudflare mutation was attempted."

          bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Web production release" "$AUTH_BODY_HASH"
          current_main="$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" \
            || fail "Cannot re-check current main HEAD."
          [ "$current_main" = "$WEB_SHA" ] \
            || fail "main moved after release approval; re-authorize the new exact SHA."

          current_info="$(curl -fsS https://pino-web.minhtri-van42.workers.dev/build-info.json)" \
            || fail "Cannot inspect current production identity."
          current_sha="$(jq -r '.commit // empty' <<<"$current_info")"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]] || fail "Current production SHA is not trustworthy."
          git cat-file -e "${current_sha}^{commit}" 2>/dev/null \
            || fail "Current production SHA is not present in repository history."
          git merge-base --is-ancestor "$current_sha" "$WEB_SHA" \
            || fail "Current production SHA is not an ancestor of the approved main SHA; forward-only release is required."

          if [ "$current_sha" = "$WEB_SHA" ]; then already_active=1; fi

          config_diff="$RUNNER_TEMP/web-production-config.diff"
          git diff --unified=0 "$current_sha" "$WEB_SHA" -- wrangler.toml wrangler.piner.production.toml > "$config_diff" || true
          unexpected_config="$(grep -E '^[+-][^+-]' "$config_diff" | grep -Ev 'PINO_CORE_BASE_URL|Keep false while production pino-web reads from pino-core-dev|explicitly approved production pino-core cutover|^[-+]\[\[services\]\]$|^[-+]binding = "PINO_CORE_PUBLIC"$|^[-+]service = "pino-core"$|^[-+]entrypoint = "PublicOpenStudioControlPlane"$' || true)"
          [ -z "$unexpected_config" ] || fail "Candidate contains an unapproved production Wrangler config delta."

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}")" \
            || fail "Cannot inspect current production deployment."
          old_deployment_id="$(jq -r '.result.deployments[0].id // empty' <<<"$deployments")"
          old_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployments" | head -1)"
          [ -n "$old_deployment_id" ] && [ -n "$old_version" ] || fail "Cannot resolve one active 100% deployment/version before release."

          versions="$(npx wrangler versions list --name "$WEB_WORKER" --json)" \
            || fail "Cannot list immutable candidate versions."
          candidate_id="$(jq -r --arg tag "$WEB_SHA" '[.[] | select(.annotations["workers/tag"] == $tag)] | if length == 1 then .[0].id else empty end' <<<"$versions")"
          [ -n "$candidate_id" ] \
            || fail "Exactly one recent immutable version tagged with the approved SHA is required."
          candidate_message="$(jq -r --arg id "$candidate_id" '.[] | select(.id == $id) | .annotations["workers/message"] // empty' <<<"$versions")"
          [ "$candidate_message" = "pino-web candidate ${WEB_SHA}" ] \
            || fail "Candidate version message does not bind to the approved SHA."

          old_detail="$(npx wrangler versions view "$old_version" --name "$WEB_WORKER" --json)" \
            || fail "Cannot inspect active version resources."
          candidate_detail="$(npx wrangler versions view "$candidate_id" --name "$WEB_WORKER" --json)" \
            || fail "Cannot inspect candidate resources."
          jq -e '[.resources.bindings[]? | select(.name=="PINO_CORE_PUBLIC" and .type=="service" and .service=="pino-core" and .entrypoint=="PublicOpenStudioControlPlane")] | length==1' <<<"$candidate_detail" >/dev/null \
            || fail "Candidate lacks exact PINO_CORE_PUBLIC -> pino-core/PublicOpenStudioControlPlane service binding."
          jq -e '[.resources.bindings[]? | select(.name=="PINO_CORE_BASE_URL")] | length==0' <<<"$candidate_detail" >/dev/null \
            || fail "Candidate retains forbidden dev-Core URL binding."
          old_bindings="$(jq -c '[.resources.bindings[]? | select(.name!="PINO_CORE_BASE_URL" and .name!="PINO_CORE_PUBLIC") | {name,type,text:(.text // null),service:(.service // null),entrypoint:(.entrypoint // null)}] | sort_by(.name)' <<<"$old_detail")"
          new_bindings="$(jq -c '[.resources.bindings[]? | select(.name!="PINO_CORE_BASE_URL" and .name!="PINO_CORE_PUBLIC") | {name,type,text:(.text // null),service:(.service // null),entrypoint:(.entrypoint // null)}] | sort_by(.name)' <<<"$candidate_detail")"
          [ "$old_bindings" = "$new_bindings" ] \
            || fail "Candidate changes production bindings outside the one approved Core service-binding cutover."

          if [ "$already_active" -eq 1 ]; then
            [ "$old_version" = "$candidate_id" ] || fail "Build identity says approved SHA is active but immutable Worker version does not match candidate."
            final_main="$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" || fail "Cannot verify main before already-active PASS."
            [ "$final_main" = "$WEB_SHA" ] || fail "main moved before already-active PASS."
            final="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}")" || fail "Cannot verify deployment before already-active PASS."
            [ "$(jq -r '.result.deployments[0].id // empty' <<<"$final")" = "$old_deployment_id" ] || fail "Web deployment identity changed before already-active PASS."
            [ "$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$final" | head -1)" = "$candidate_id" ] || fail "Approved Web candidate stopped serving before already-active PASS."
            bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Web production release" "$AUTH_BODY_HASH"
            status="$(curl -sS -o /tmp/already-core-sessions.json -D /tmp/already-core-sessions.headers -w '%{http_code}' https://pino-web.minhtri-van42.workers.dev/api/pino-core/open-studio/sessions)"
            [ "$status" = "200" ] || fail "Already-active Web->Core Open Studio proxy failed with HTTP ${status}."
            jq -e '.sessions | type == "array"' /tmp/already-core-sessions.json >/dev/null || fail "Already-active Web->Core proxy returned invalid payload."
            grep -Eqi '^X-PINO-Schedule-Source:[[:space:]]*core[[:space:]]*$' /tmp/already-core-sessions.headers || fail "Already-active Open Studio proxy did not prove canonical Core source."
            routes="$(curl -fsS "${api}/zones/${ZONE_ID}/workers/routes" "${auth[@]}")" || fail "Cannot inspect already-active Web routes."
            for pattern in 'pinohouse.art/artchitect*' 'www.pinohouse.art/artchitect*' 'pinohouse.art/little-piner*' 'www.pinohouse.art/little-piner*'; do
              jq -e --arg p "$pattern" --arg s "$WEB_WORKER" '[.result[]? | select(.pattern==$p and .script==$s)] | length==1' <<<"$routes" >/dev/null || fail "Required public route ${pattern} is not attached exactly once to pino-web."
            done
            for url in 'https://pinohouse.art/artchitect' 'https://www.pinohouse.art/artchitect' 'https://pinohouse.art/little-piner' 'https://www.pinohouse.art/little-piner'; do
              status="$(curl -LsS --max-redirs 3 -o /tmp/already-public-route.html -w '%{http_code}' "$url")"
              [ "$status" = "200" ] || fail "Already-active public route ${url} failed with HTTP ${status}."
              grep -q 'PINO' /tmp/already-public-route.html || fail "Already-active public route ${url} did not return PINO content."
            done
            comment "WEB_PRODUCTION_RELEASE: **PASS_ALREADY_ACTIVE**\n\n- Web source: ${WEB_SHA}\n- Workflow run: ${GITHUB_RUN_ID}\n- Workflow attempt: ${GITHUB_RUN_ATTEMPT}\n- Worker version: ${candidate_id}\n- Deployment ID: ${old_deployment_id}\n- Traffic: already 100%\n- Exact main + immutable deployment: terminally reverified\n\nNo mutation was attempted."
            exit 0
          fi

          deployments_predeploy="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}")" || fail "Cannot re-read Web deployment immediately before promotion."
          [ "$(jq -r '.result.deployments[0].id // empty' <<<"$deployments_predeploy")" = "$old_deployment_id" ] || fail "Web deployment drifted after preflight and before promotion."
          [ "$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployments_predeploy" | head -1)" = "$old_version" ] || fail "Web version drifted after preflight and before promotion."
          main_predeploy="$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" || fail "Cannot re-read main immediately before promotion."
          [ "$main_predeploy" = "$WEB_SHA" ] || fail "main moved immediately before Web promotion."

          deployment_nonce="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$deployment_nonce" =~ ^[0-9a-f-]{36}$ ]] || fail "Cannot create Web deployment proof nonce."
          deployment_marker="PINO_WEB_PRODUCTION_RELEASE:${WEB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${deployment_nonce}"
          recovery_body="PINO_WEB_PRODUCTION_RELEASE: **RECOVERY_ARMED**\n\nWorkflow run: ${GITHUB_RUN_ID}\nWorkflow attempt: ${GITHUB_RUN_ATTEMPT}\nSource SHA: ${WEB_SHA}\nOld deployment ID: ${old_deployment_id}\nOld version ID: ${old_version}\nCandidate version ID: ${candidate_id}\nDeployment marker: ${deployment_marker}\n\nIndependent recovery identity persisted before traffic mutation."
          comment "$recovery_body" >/dev/null || fail "Could not persist production traffic recovery identity before promotion."
          promotion_attempted=1
          deploy_output="$RUNNER_TEMP/web-version-deploy.ndjson"; rm -f "$deploy_output"
          set +e
          WRANGLER_OUTPUT_FILE_PATH="$deploy_output" npx wrangler versions deploy --name "$WEB_WORKER" --version-tag "${WEB_SHA}@100%" --message "$deployment_marker" -y >/dev/null
          deploy_rc=$?
          set -e
          if [ -s "$deploy_output" ]; then candidate_deployment_id="$(jq -r 'select(.type == "version-deploy") | .deployment_id // empty' "$deploy_output" | tail -1)"; fi
          [ "$deploy_rc" -eq 0 ] || fail "Exact tagged candidate promotion failed after traffic mutation may have started."
          [ -n "$candidate_deployment_id" ] || fail "Web promotion succeeded but no immutable deployment ID was returned."

          current="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}")" \
            || fail "Cannot verify post-deploy traffic."
          active_deployment="$(jq -r '.result.deployments[0].id // empty' <<<"$current")"
          active_marker="$(jq -r '.result.deployments[0].annotations["workers/message"] // empty' <<<"$current")"
          active="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$current" | head -1)"
          [ "$active_deployment" = "$candidate_deployment_id" ] && [ "$active_marker" = "$deployment_marker" ] && [ "$active" = "$candidate_id" ] || fail "Exact marked Web deployment is not active at 100%."

          deployed_info="$(curl -fsS https://pino-web.minhtri-van42.workers.dev/build-info.json)" \
            || fail "Cannot verify deployed Worker identity."
          deployed_sha="$(jq -r '.commit // empty' <<<"$deployed_info")"
          [ "$deployed_sha" = "$WEB_SHA" ] \
            || fail "Production identity does not match the approved SHA after promotion."

          status="$(curl -sS -o /tmp/home.html -w '%{http_code}' https://pino-web.minhtri-van42.workers.dev/)"
          [ "$status" = "200" ] || fail "Production root smoke failed with HTTP ${status}."
          status="$(curl -sS -o /tmp/core-sessions.json -D /tmp/core-sessions.headers -w '%{http_code}' https://pino-web.minhtri-van42.workers.dev/api/pino-core/open-studio/sessions)"
          [ "$status" = "200" ] || fail "Production Web->Core Open Studio proxy failed with HTTP ${status}."
          jq -e '.sessions | type == "array"' /tmp/core-sessions.json >/dev/null || fail "Production Web->Core Open Studio proxy returned invalid payload."
          grep -Eqi '^X-PINO-Schedule-Source:[[:space:]]*core[[:space:]]*$' /tmp/core-sessions.headers || fail "Production Open Studio proxy did not prove canonical Core source."

          routes="$(curl -fsS "${api}/zones/${ZONE_ID}/workers/routes" "${auth[@]}")" || fail "Cannot inspect production Web routes."
          for pattern in 'pinohouse.art/artchitect*' 'www.pinohouse.art/artchitect*' 'pinohouse.art/little-piner*' 'www.pinohouse.art/little-piner*'; do
            jq -e --arg p "$pattern" --arg s "$WEB_WORKER" '[.result[]? | select(.pattern==$p and .script==$s)] | length==1' <<<"$routes" >/dev/null || fail "Required public route ${pattern} is not attached exactly once to pino-web."
          done
          for url in 'https://pinohouse.art/artchitect' 'https://www.pinohouse.art/artchitect' 'https://pinohouse.art/little-piner' 'https://www.pinohouse.art/little-piner'; do
            status="$(curl -LsS --max-redirs 3 -o /tmp/public-route.html -w '%{http_code}' "$url")"
            [ "$status" = "200" ] || fail "Public production route ${url} failed with HTTP ${status}."
            grep -q 'PINO' /tmp/public-route.html || fail "Public production route ${url} did not return PINO content."
          done

          final_main="$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" \
            || fail "Cannot verify main after promotion."
          [ "$final_main" = "$WEB_SHA" ] \
            || fail "main moved during promotion; rollback to prior 100% version."
          final_deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_WORKER}/deployments" "${auth[@]}")" || fail "Cannot verify immutable Web deployment before terminal PASS."
          [ "$(jq -r '.result.deployments[0].id // empty' <<<"$final_deployments")" = "$candidate_deployment_id" ] || fail "Web deployment identity changed before terminal PASS."
          [ "$(jq -r '.result.deployments[0].annotations["workers/message"] // empty' <<<"$final_deployments")" = "$deployment_marker" ] || fail "Web deployment marker changed before terminal PASS."
          [ "$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$final_deployments" | head -1)" = "$candidate_id" ] || fail "Web candidate stopped serving before terminal PASS."

          bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Web production release" "$AUTH_BODY_HASH"
          promotion_attempted=0
          comment "WEB_PRODUCTION_RELEASE: **PASS**\n\n- Web source: ${WEB_SHA}\n- Workflow run: ${GITHUB_RUN_ID}\n- Workflow attempt: ${GITHUB_RUN_ATTEMPT}\n- Worker version: ${candidate_id}\n- Deployment ID: ${candidate_deployment_id}\n- Traffic: 100%\n- CI: successful main run required\n- Provenance: merged PR into main required\n- Candidate: immutable SHA-tagged Workers Build\n- Production config: exact Core service-binding cutover only\n- Web->Core production Open Studio proxy: PASS\n- pinohouse.art/www Artchitect + Little Piner routed ingress: PASS\n\nNo route, binding, secret, D1, or application-data mutation was performed."
