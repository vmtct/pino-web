name: Web Staging CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
  WEB_STAGING_WORKER: pino-web-staging
  WEB_STAGING_URL: https://pino-web-staging.minhtri-van42.workers.dev
  WEB_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pino-web-staging-worker-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - name: Validate exact staging target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEB_SHA"
          grep -q 'name = "pino-web-staging"' wrangler.staging.toml
          grep -q 'service = "pino-core-staging"' wrangler.staging.toml
      - name: Build deployable staging artifact
        run: bun run build
      - name: Deploy, read back, smoke, and rollback safely on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PINO_WEB_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Read the canonical Cloudflare deployment API rather than Wrangler's JSON presentation.
          fetch_deployments() {
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WEB_STAGING_WORKER}/deployments?per_page=10"
          }

          active_version() {
            fetch_deployments | jq -er '
              if .success != true then error("Cloudflare deployments API failed") else
                [.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id]
                | if length == 1 then .[0] else error("Expected exactly one 100-percent active version") end
              end'
          }

          previous_version="$(active_version)"
          test -n "$previous_version"
          message="staging sha=${WEB_SHA} run=${GITHUB_RUN_ID}"
          active_message="$(fetch_deployments | jq -er 'if .success == true then (.result.deployments[0].annotations["workers/message"] // "") else error("Cloudflare deployments API failed") end')"
          deployed_this_run=false
          deployment_run_id="$GITHUB_RUN_ID"

          if [[ "$active_message" == "staging sha=${WEB_SHA} run="* ]]; then
            echo "Active Web Worker already matches exact source SHA; smoke-only catch-up"
            deployed_version="$previous_version"
            deployment_run_id="${active_message##* run=}"
          else
            short_sha="${WEB_SHA:0:12}"
            npx --yes wrangler@4.134.0 deploy -c wrangler.staging.toml --tag "staging-${short_sha}" --message "$message"
            deployed_this_run=true
            fetch_deployments > deployment.json
            deployed_version="$(jq -er --arg m "$message" '
              if .success != true then error("Cloudflare deployments API failed") else
                .result.deployments[0] as $d
                | if $d.annotations["workers/message"] != $m then
                    error("Latest deployment does not match this run and SHA")
                  else
                    [$d.versions[]? | select(.percentage == 100) | .version_id]
                    | if length == 1 then .[0] else error("Expected exactly one deployed 100-percent version") end
                  end
              end' deployment.json)"
          fi
          test -n "$deployed_version"
          test "$(active_version)" = "$deployed_version"

          smoke_ok=true
          code=""
          for _ in $(seq 1 12); do
            code="$(curl -sS --max-time 15 -o /tmp/build-info.json -D /tmp/build-info.headers -w '%{http_code}' "${WEB_STAGING_URL}/build-info.json" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            smoke_ok=false
          elif ! jq -e --arg sha "$WEB_SHA" '.sha == $sha or .commit == $sha or .sourceSha == $sha' /tmp/build-info.json >/dev/null; then
            smoke_ok=false
          else
            core_code="$(curl -sS --max-time 15 -o /tmp/core-sessions.json -D /tmp/core-sessions.headers -w '%{http_code}' "${WEB_STAGING_URL}/api/pino-core/open-studio/sessions" || true)"
            if [ "$core_code" != 200 ] || ! grep -qi '^X-PINO-Schedule-Source: core' /tmp/core-sessions.headers; then
              smoke_ok=false
            fi
          fi

          if [ "$smoke_ok" != true ]; then
            current_version="$(active_version)"
            if [ "$deployed_this_run" = true ] && [ "$current_version" = "$deployed_version" ]; then
              npx --yes wrangler@4.134.0 rollback "$previous_version" -c wrangler.staging.toml --message "staging rollback failed-sha=${WEB_SHA} run=${GITHUB_RUN_ID}"
              test "$(active_version)" = "$previous_version"
            else
              echo "Not owner of active staging version or source already deployed; refusing rollback" >&2
            fi
            exit 1
          fi

          jq -n \
            --arg runtime web \
            --arg sourceSha "$WEB_SHA" \
            --arg worker "$WEB_STAGING_WORKER" \
            --arg previousVersionId "$previous_version" \
            --arg activeVersionId "$deployed_version" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg deploymentRunId "$deployment_run_id" \
            --arg reusedExistingDeployment "$([ "$deployed_this_run" = false ] && echo true || echo false)" \
            '{kind:"PINO_STAGING_RUNTIME_RECEIPT",runtime:$runtime,sourceSha:$sourceSha,worker:$worker,previousVersionId:$previousVersionId,activeVersionId:$activeVersionId,runId:$runId,deploymentRunId:$deploymentRunId,reusedExistingDeployment:($reusedExistingDeployment=="true"),smokeResult:"PASS",result:"PASS",productionMutation:false}' \
            | tee staging-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-web-receipt
          path: staging-receipt.json
