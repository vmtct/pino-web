name: one-time session path fix 2
on:
  push:
    branches: [fix/session-path-resolver]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix worker helper reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker.ts")
          s = p.read_text()
          old = 'const pathResponse=await getPage(env,pathId);if(!pathResponse.ok)continue;const pathPage=await pathResponse.json() as {properties?:any};'
          new = 'const pathResponse=await fetch(`https://api.notion.com/v1/pages/${pathId}`,{method:"GET",headers:notionHeaders(env)});if(!pathResponse.ok)continue;const pathPage=await pathResponse.json() as {properties?:any};'
          if old not in s:
              raise SystemExit("getPage target not found")
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-session-path-fix-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.ts .github/workflows/one-time-session-path-fix-2.yml
          git commit -m "fix: use local Notion page fetch in session resolver"
          git push