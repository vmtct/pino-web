name: Validate Piner Toppi Module

on:
  push:
    branches:
      - feat/piner-toppi-module-v1-20260830

concurrency:
  group: pino-web-staging-piner-toppi-module
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck excluding known main baseline debt
        shell: bash
        run: |
          cat > .tmp-tsconfig.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "incremental": false },
            "exclude": ["node_modules", "e2e/member-booking.spec.ts"]
          }
          JSON
          npx tsc -p .tmp-tsconfig.json --noEmit
      - name: Run Piner member contract tests
        run: >-
          node --test --experimental-strip-types
          test/piner-member-core-adapter.test.ts
          test/piner-member-projections.test.ts
          test/piner-toppi-adapter.test.ts
          test/piner-toppi-projection.test.ts
          test/piner-toppi-practice-projection.test.ts
          test/piner-worker.test.ts
      - name: Production compile excluding known main baseline debt
        shell: bash
        run: |
          cp next.config.ts /tmp/next.config.ts
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'next.config.ts';
          const source = readFileSync(path, 'utf8');
          const anchor = '  output: "export",';
          if (!source.includes(anchor)) throw new Error('next config anchor missing');
          writeFileSync(path, source.replace(anchor, `${anchor}\n  typescript: { ignoreBuildErrors: true },`));
          NODE
          npm run build
          cp /tmp/next.config.ts next.config.ts
          git diff --exit-code -- next.config.ts
      - name: Verify Practice UI contract is wired through Piner only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'practice/completions' lib/piner-toppi-adapter.ts
          grep -Fq 'toppi-practice-record-start' app/piner/piner-member-entry.tsx
          grep -Fq 'MediaRecorder' app/piner/piner-member-entry.tsx
