name: Web staging deploy

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: pino-web-staging-worker-mutation
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.issue.title == '[GPT] Web staging deploy' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
      STAGING_WORKER: pino-web-staging
      STAGING_URL: https://pino-web-staging.minhtri-van42.workers.dev
    steps:
      - name: Validate exact-main staging request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          reject() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WEB_STAGING_DEPLOY: REJECTED\n\n$1\n\nNo staging or production mutation was attempted."; exit 1; }
          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^WEB_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one WEB_SHA line."
          web_sha="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          grep -Eq '^CONFIRM:[[:space:]]*DEPLOY_WEB_STAGING[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing CONFIRM: DEPLOY_WEB_STAGING."
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" || reject "Cannot resolve current main."
          [ "$web_sha" = "$main_sha" ] || reject "Requested SHA is not current Web main."
          ci="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${web_sha}&branch=main&status=completed&per_page=20")" || reject "Cannot inspect exact-main CI."
          jq -e --arg sha "$web_sha" '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success")] | length >= 1' <<<"$ci" >/dev/null || reject "No successful exact-main CI exists."
          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"
          echo "WEB_SHA=$web_sha" >> "$GITHUB_ENV"

      - name: Checkout exact Web main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.web_sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Re-run source validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEB_SHA"
          test -z "$(git status --porcelain)"
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: Assert staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node --test --experimental-strip-types test/staging-governance.test.ts

      - name: Deploy exact Web source to staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PINO_WEB_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CLOUDFLARE_API_TOKEN unavailable" >&2; exit 1; }
          npx --yes wrangler@4.134.0 deploy -c wrangler.staging.toml --tag "staging-${WEB_SHA:0:12}" --message "Web staging ${WEB_SHA}"
      - name: Smoke exact staging runtime
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local path="$1" out="$2" code=""
            for _ in $(seq 1 12); do
              code="$(curl -sS --max-time 15 -o "$out" -D "${out}.headers" -w '%{http_code}' "${STAGING_URL}${path}")"
              [ "$code" = "200" ] && return 0
              sleep 2
            done
            echo "Smoke failed: ${path} -> ${code}" >&2
            cat "$out" >&2 || true
            return 1
          }
          probe "/build-info.json" /tmp/build-info.json
          jq -e --arg sha "$WEB_SHA" '.sha == $sha or .commit == $sha or .sourceSha == $sha' /tmp/build-info.json >/dev/null || {
            echo "build-info does not bind exact Web SHA" >&2; cat /tmp/build-info.json >&2; exit 1;
          }
          probe "/api/pino-core/open-studio/sessions" /tmp/core-sessions.json
          grep -qi '^X-PINO-Schedule-Source: core' /tmp/core-sessions.json.headers || { echo "Web staging is not serving schedule from Core staging" >&2; exit 1; }
          echo "WEB_STAGING_SMOKE=PASS"

      - name: Report staging PASS
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WEB_STAGING_DEPLOY: PASS\n\nWeb source: ${WEB_SHA}\nWorker: ${STAGING_WORKER}\nURL: ${STAGING_URL}\nExact build identity + Core-staging service bridge: PASS\n\nNo production Worker, production route/domain, or production traffic mutation was authorized."

      - name: Report staging failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WEB_STAGING_DEPLOY: FAIL_SAFE\n\nWeb source: ${WEB_SHA:-unknown}\nProduction Worker, routes/domains, and traffic were outside this workflow authority."
