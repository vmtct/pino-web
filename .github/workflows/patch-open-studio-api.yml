name: Patch Open Studio API

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch session feed to fail soft on booking-count errors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.ts')
          s = p.read_text()
          old = 'const confirmedResult=await getConfirmedCount(env,page.id);if(!confirmedResult.ok)return confirmedResult;const confirmedCount=confirmedResult.count;const availableSeats=capacity===null?null:Math.max(0,capacity-confirmedCount);'
          new = 'const confirmedResult=await getConfirmedCount(env,page.id);const confirmedCount=confirmedResult.ok?confirmedResult.count:null;const availableSeats=capacity===null||confirmedCount===null?null:Math.max(0,capacity-confirmedCount);'
          if old not in s:
              print('Patch already applied or target changed; no-op')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep Open Studio feed available when booking counts fail'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
